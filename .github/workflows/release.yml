name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version (vX.Y.Z)
        required: true
        type: string
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+

jobs:
  release:
    name: Release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve version
        id: vars
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}"
          } else {
            $version = "${{ github.ref_name }}"
          }

          if ($version -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Invalid version '$version'. Expected vX.Y.Z."
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "zip_name=LUI-$version.zip" >> $env:GITHUB_OUTPUT
          "installer_name=LUI-$version-installer.exe" >> $env:GITHUB_OUTPUT
          "zip_path=dist\LUI-$version.zip" >> $env:GITHUB_OUTPUT
          "installer_path=dist\LUI-$version-installer.exe" >> $env:GITHUB_OUTPUT

      - name: Prepare staged payload
        shell: pwsh
        run: |
          $stageRoot = Join-Path $PWD "dist\stage"
          $payloadRoot = Join-Path $stageRoot "LUI"

          Remove-Item dist -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $payloadRoot | Out-Null

          Copy-Item src -Destination $payloadRoot -Recurse -Force
          Copy-Item LUI.plugin -Destination $payloadRoot -Force
          Copy-Item LICENSE -Destination $payloadRoot -Force
          Copy-Item README.md -Destination $payloadRoot -Force

      - name: Package zip
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\stage\LUI" -DestinationPath "${{ steps.vars.outputs.zip_path }}" -Force

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=${{ steps.vars.outputs.version }}" `
            "/DMySourceDir=$((Resolve-Path 'dist\stage\LUI').Path)" `
            "/DMyOutputDir=$((Resolve-Path 'dist').Path)" `
            "/DMyOutputBaseFilename=LUI-${{ steps.vars.outputs.version }}-installer" `
            "installer\LUI.iss"

      - name: Create GitHub release
        shell: pwsh
        run: |
          gh release create "${{ steps.vars.outputs.version }}" `
            "${{ steps.vars.outputs.zip_path }}" `
            "${{ steps.vars.outputs.installer_path }}" `
            --target "${{ github.sha }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
