name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version (vX.Y.Z)
        required: true
        type: string
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+

jobs:
  release:
    name: Release ${{ github.ref_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Package zip
        id: package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            version="${{ inputs.version }}"
          fi

          zip_name="LUI-${version}.zip"

          rm -rf dist "${zip_name}"
          mkdir -p dist/Geldahr

          cp -r LUI dist/Geldahr/
          cp LUI.* dist/Geldahr/
          cp LICENSE dist/Geldahr/
          cp README.md dist/Geldahr/

          (cd dist && zip -r "../${zip_name}" Geldahr)

      - name: Create GitHub release
        run: |
            gh release create ${{ github.ref_name }} LUI-*.zip
        env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
