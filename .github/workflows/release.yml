name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version (vX.Y.Z)
        required: true
        type: string
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve version
        id: vars
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version="${{ inputs.version }}"
          else
            version="${{ github.ref_name }}"
          fi

          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version '$version'. Expected vX.Y.Z." >&2
            exit 1
          fi

          {
            echo "version=$version"
            echo "zip_path=dist/LUI-$version.zip"
            echo "bat_path=dist/LUI-$version-windows-installer.bat"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare staged payload
        shell: bash
        run: |
          stage_root="$PWD/dist/stage"
          payload_root="$stage_root/LUI"

          rm -rf dist
          mkdir -p "$payload_root"

          cp -R src "$payload_root/"
          cp LUI.plugin "$payload_root/"
          cp LICENSE "$payload_root/"
          cp README.md "$payload_root/"

      - name: Package zip
        shell: bash
        run: |
          (
            cd dist/stage
            zip -qr "$GITHUB_WORKSPACE/${{ steps.vars.outputs.zip_path }}" LUI
          )

      - name: Build batch installer
        shell: bash
        run: |
          bash tools/build_embedded_zip_bat.sh \
            --zip-path "${{ steps.vars.outputs.zip_path }}" \
            --bat-path "${{ steps.vars.outputs.bat_path }}" \
            --target-root '%USERPROFILE%\Documents\The Lord of the Rings Online\Plugins'

      - name: Create GitHub release
        shell: bash
        run: |
          gh release create "${{ steps.vars.outputs.version }}" \
            "${{ steps.vars.outputs.zip_path }}" \
            "${{ steps.vars.outputs.bat_path }}" \
            --target "${{ github.sha }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
